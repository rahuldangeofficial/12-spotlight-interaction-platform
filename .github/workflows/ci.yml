name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type-check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Yarn 1 (the lockfile format)
        run: npm install -g yarn@1.22.22
      - name: Install dependencies exactly as locked
        run: yarn install --frozen-lockfile --non-interactive
      - name: Type-check every package
        run: yarn ts:check
      - name: Lint every package
        run: yarn lint
